name: Feature request
description: Suggest an improvement or a new capability for Quizgeist.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user need so that the proposal can be evaluated in context.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve, and who experiences it?
      placeholder: Describe the use case and its impact.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Quizgeist to do?
      placeholder: Describe the behavior or workflow you are proposing.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?
      placeholder: Explain alternatives you tried or would be willing to use.
    validations:
      required: true
